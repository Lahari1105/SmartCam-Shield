{% extends "base.html" %}

{% block title %}Login | Smart Cam Shield{% endblock %}

{% block content %}
<section class="auth-premium-section">
    <div class="auth-premium-card">

        <div class="auth-logo-wrap">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Smart Cam Shield Logo" class="auth-logo">
        </div>

        <h1 class="auth-premium-title">LOGIN</h1>

        <form class="auth-premium-form" id="loginForm" autocomplete="off">
            <div class="input-group">
                <span class="input-icon">👤</span>
                <input type="text" name="username" id="loginUsername" placeholder="Enter your username" required>
            </div>

            <div class="input-group">
                <span class="input-icon">🔒</span>
                <input type="password" name="password" id="loginPassword" placeholder="Enter your password" required>
            </div>

            <div class="auth-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <div class="form-error" id="loginError" style="display:none;"></div>

            <button type="submit" class="auth-main-btn" id="loginSubmitBtn">
                <span class="btn-text">LOGIN</span>
                <span class="btn-loader" style="display:none;"></span>
            </button>

            <p class="auth-switch-text">
                Don't have an account?
                <a href="{{ url_for('signup') }}">Sign Up</a>
            </p>
        </form>
    </div>
</section>
{% endblock %}
